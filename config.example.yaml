# FastTelethon 统一配置（项目根目录）
# 数据库：收藏（jiankong）与各番剧分集下载/上传状态共用同一 SQLite

database:
  path: data/app_state.sqlite

proxy:
  # 下载：不使用代理（进程内会清空 HTTP_PROXY 等，且 m3u8dl 不注入 custom_proxy）
  download:
    enabled: false
  # 上传 Telegram：SOCKS5（写入子进程 TELEGRAM_PROXY）
  upload:
    enabled: true
    socks5:
      host: 127.0.0.1
      port: 10809
      username: ''
      password: ''

paths:
  cover: Telethon-FastUpload/cover.jpeg
  telethon_fastupload_script: Telethon-FastUpload/Telethon_FastUpload_speed.py
  telethon_env_file: Telethon-FastUpload/.env

telegram:
  api_id: 'YOUR_API_ID'
  api_hash: 'YOUR_API_HASH'
  target: '-100xxxxxxxxx'
  session_path: Telethon-FastUpload/session.session
  phone: '+1xxxxxxxxx'

fastupload:
  enabled: true
  # parallel: true 时才用 FastTelethon 多连接分片（易在部分网络卡住；默认不写即为关）
  parallel: false
  connections: 16

runtime:
  upload_enabled: true
  upload_retries: 5

m3u8dl_re:
  executable: N_m3u8DL-RE
  log_level: ERROR
  auto_select: true
  ffmpeg_binary_path: ''
  binary_merge: false
  use_ffmpeg_concat_demuxer: false
  tmp_dir: ''
  http_request_timeout: '100'
  download_retry_count: '3'
  thread_count: ''
  disable_update_check: true
  user_agent: ''
  referer: ''
  cookie: ''
  headers: ''
  extra_args: []

# ===== v3.0: 配置驱动多频道监控 =====
monitor:
  # 通知 Bot（变更时发送 Telegram 消息）
  notify_bot_token: "YOUR_BOT_TOKEN"
  notify_chat_id: "YOUR_CHAT_ID"

  # 视频站基础 URL（搜索 + m3u8 解析）
  # V2 精确匹配需要 moon.658877.xyz（返回 year/douban_id/class 等元数据）
  base_url: "https://moon.658877.xyz"

  # 循环检查间隔（秒），可在命令行 --interval 覆盖
  interval: 1800

  # 站点集数上涨时，用 Telethon 扫频道历史（#标签 +「第N集」）核对频道已发最大集，避免虚高重复拉取
  telegram_channel_verify:
    enabled: true
    scan_message_limit: 400

  # 频道列表：每个频道对应一个 Telegram 群组/频道
  channels:
    - id: anime
      name: "动漫频道"
      telegram_chat_id: "-1003966238914"
      cover: "covers/anime.jpeg"               # 可选：频道封面图
      sort_order: 1
      shows:
        - id: mushenji
          search_keyword: "牧神记"
          topic_name: "牧神记"
          anime_prefix: "牧神记第"
          caption_file: "Telethon-FastUpload/牧神记.txt"
          download_dir: "xiazai/downloads/mushenji"
          urls_file: "data/urls/anime/牧神记.txt"   # URL txt 文件（一行一集）
          sort_order: 1
          # V2 精确匹配过滤器（可选，不配置则走 V1 多供应商比较）
          filters:
            douban_id: "36576581"       # 豆瓣ID，最精确的匹配方式
            # year_min: 2024            # 可选：最小开播年份
            # year_max: 2025            # 可选：最大开播年份
            # class_keywords: ["动画"]  # 可选：类型必须含这些关键词
            # source_preference: "jisu" # 可选：优先选择特定源
            # type_name: "动漫"         # 可选：类型名精确匹配
        - id: xianni
          search_keyword: "仙逆"
          topic_name: "仙逆"
          anime_prefix: "仙逆第"
          caption_file: "Telethon-FastUpload/仙逆.txt"
          download_dir: "xiazai/downloads/xianni"
          urls_file: "data/urls/anime/仙逆.txt"   # URL txt 文件（一行一集）
          sort_order: 2
